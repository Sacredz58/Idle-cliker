name: Тесты и публикация

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Автотесты
        run: node tests/run.js
      - name: Релизная сборка (консоль разработчика выключена)
        run: |
          mkdir dist
          cp index.html style.css game.js dist/
          sed -i 's/const DEV_ALLOWED=true/const DEV_ALLOWED=false/' dist/game.js
          grep -q "const DEV_ALLOWED=false" dist/game.js
          (cd dist && zip -r ../yandex-games.zip index.html style.css game.js)
      - name: Архив для Яндекс Игр
        uses: actions/upload-artifact@v4
        with:
          name: yandex-games
          path: yandex-games.zip
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
